<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hela Full Board</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#172033
}
button,input{font:inherit}
button{cursor:pointer}

#login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:linear-gradient(135deg,#5146d8,#8b5cf6)
}

.login-box{
  width:min(430px,100%);
  background:#fff;
  padding:30px;
  border-radius:24px;
  box-shadow:0 20px 60px #0004
}

.logo{
  width:65px;
  height:65px;
  margin:auto;
  border-radius:18px;
  background:#635bff;
  color:white;
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:bold
}

.login-box h1{
  text-align:center;
  margin:15px 0 5px
}

.login-box p{
  text-align:center;
  color:#777
}

.input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:11px;
  outline:none
}

.btn{
  background:#5b4bdb;
  color:white;
  border:0;
  padding:12px 17px;
  border-radius:11px;
  font-weight:bold
}

.full{width:100%}

#error{
  color:#dc2626;
  text-align:center;
  margin-top:12px
}

/* APP */

#app{display:none}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:255px;
  background:#11162a;
  color:white;
  padding:18px;
  z-index:20
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:25px
}

.brand .logo{
  width:44px;
  height:44px;
  margin:0;
  font-size:20px
}

.brand small{
  display:block;
  color:#aaa;
  margin-top:3px
}

nav button{
  display:block;
  width:100%;
  border:0;
  background:transparent;
  color:#cbd0df;
  padding:13px;
  border-radius:10px;
  text-align:left;
  margin:3px 0
}

nav button:hover,
nav button.active{
  background:#292f4c;
  color:#fff
}

.logout{
  position:absolute;
  left:18px;
  right:18px;
  bottom:20px
}

main{
  margin-left:255px
}

header{
  height:70px;
  background:#fff;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:10
}

.user{
  display:flex;
  align-items:center;
  gap:10px
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#e9e5ff;
  color:#5144c8;
  display:grid;
  place-items:center;
  font-weight:bold
}

.menu{
  display:none;
  border:0;
  background:none;
  font-size:25px
}

.content{
  padding:25px
}

.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px
}

.title h2{margin:0}

.muted{color:#737b8c}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px
}

.card{
  background:#fff;
  border:1px solid #e7e9ef;
  border-radius:18px;
  padding:20px;
  box-shadow:0 7px 25px #1e293b0b;
  margin-bottom:16px
}

.grid{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:16px;
  margin-top:16px
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  padding:13px;
  border-bottom:1px solid #eee;
  text-align:left
}

th{
  background:#fafafa
}

.notice{
  background:#f7f6ff;
  border-left:4px solid #5b4bdb;
  border-radius:10px;
  padding:14px;
  margin:10px 0
}

.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:12px
}

.green{
  background:#dcfce7;
  color:#166534
}

.red{
  background:#fee2e2;
  color:#991b1b
}

@media(max-width:900px){

  .sidebar{
    transform:translateX(-100%);
    transition:.25s
  }

  .sidebar.open{
    transform:translateX(0)
  }

  main{
    margin-left:0
  }

  .menu{
    display:block
  }

  .cards{
    grid-template-columns:repeat(2,1fr)
  }

  .grid{
    grid-template-columns:1fr
  }
}

@media(max-width:600px){

  .cards{
    grid-template-columns:1fr
  }

  .content{
    padding:15px
  }

  header{
    padding:0 15px
  }

  table{
    font-size:13px
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login">

  <div class="login-box">

    <div class="logo">H</div>

    <h1>Hela Full Board</h1>

    <p>School Management Portal</p>

    <input
      id="email"
      class="input"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Password"
    >

    <button
      id="loginBtn"
      class="btn full">
      Login
    </button>

    <div id="error"></div>

  </div>

</div>


<!-- APP -->

<div id="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">

      <div class="logo">H</div>

      <div>
        <b>Hela Full Board</b>
        <small>School Portal</small>
      </div>

    </div>

    <nav>

      <button data-page="dashboard">
        🏠 Dashboard
      </button>

      <button data-page="attendance">
        📅 Attendance
      </button>

      <button data-page="homework">
        📝 Homework
      </button>

      <button data-page="students">
        👨‍🎓 Students
      </button>

      <button data-page="results">
        📊 Results
      </button>

      <button data-page="fees">
        💳 Fees
      </button>

      <button data-page="notices">
        📢 Notices
      </button>

      <button data-page="profile">
        👤 Profile
      </button>

    </nav>

    <button
      id="logout"
      class="btn logout">
      Logout
    </button>

  </aside>


  <main>

    <header>

      <button
        id="menu"
        class="menu">
        ☰
      </button>

      <div></div>

      <div class="user">

        <div>
          <b id="userName">User</b>
          <br>
          <small id="userRole">Student</small>
        </div>

        <div
          id="avatar"
          class="avatar">
          U
        </div>

      </div>

    </header>

    <section
      id="content"
      class="content">
    </section>

  </main>

</div>


<script type="module">

/* ============================================
   FIREBASE
   Hela Full Board - YOUR REAL PROJECT
   ============================================ */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs,
  query,
  where,
  addDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* YOUR FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
  "AIzaSyDescelmyDH66voxzjVRZBug4JqHS6ZIuc",

  authDomain:
  "tyty-5f65b.firebaseapp.com",

  projectId:
  "tyty-5f65b",

  storageBucket:
  "tyty-5f65b.firebasestorage.app",

  messagingSenderId:
  "686305196099",

  appId:
  "1:686305196099:web:f074e00910490b8b4efcf6",

  measurementId:
  "G-3XM0EXZM99"

};


/* INITIALIZE */

const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


/* GLOBAL */

let currentUser = null;
let userData = null;


/* SHORTCUT */

const $ = id =>
document.getElementById(id);


/* ============================================
   LOGIN
   ============================================ */

$("loginBtn").onclick =
async function(){

  const email =
  $("email").value.trim();

  const password =
  $("password").value;

  $("error").textContent = "";


  if(!email || !password){

    $("error").textContent =
    "Email और Password डालें";

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }

  catch(error){

    console.error(error);

    $("error").textContent =
    "Login failed: " +
    error.message;

  }

};


/* ============================================
   LOGOUT
   ============================================ */

$("logout").onclick =
function(){

  signOut(auth);

};


/* ============================================
   MOBILE MENU
   ============================================ */

$("menu").onclick =
function(){

  $("sidebar")
  .classList.toggle("open");

};


/* ============================================
   NAVIGATION
   ============================================ */

document
.querySelectorAll("nav button")
.forEach(button => {

  button.onclick =
  function(){

    document
    .querySelectorAll("nav button")
    .forEach(x =>
      x.classList.remove("active")
    );


    button.classList.add("active");


    $("sidebar")
    .classList.remove("open");


    loadPage(
      button.dataset.page
    );

  };

});


/* ============================================
   AUTH STATE
   ============================================ */

onAuthStateChanged(
  auth,
  async function(user){

    if(!user){

      $("login").style.display =
      "grid";

      $("app").style.display =
      "none";

      return;
    }


    currentUser = user;


    try{

      const profile =
      await getDoc(
        doc(
          db,
          "users",
          user.uid
        )
      );


      if(profile.exists()){

        userData =
        profile.data();

      }

      else{

        userData = {

          name:
          user.email,

          email:
          user.email,

          role:
          "student"

        };

      }


      $("login").style.display =
      "none";

      $("app").style.display =
      "block";


      $("userName").textContent =
      userData.name ||
      user.email;


      $("userRole").textContent =
      userData.role ||
      "student";


      $("avatar").textContent =
      (
        userData.name ||
        "U"
      )
      .charAt(0)
      .toUpperCase();


      loadPage("dashboard");

    }

    catch(error){

      console.error(error);

      alert(
        "Firestore connection error: " +
        error.message
      );

    }

  }
);


/* ============================================
   PAGE LOADER
   ============================================ */

function loadPage(page){

  if(page === "dashboard")
    dashboard();

  if(page === "attendance")
    attendance();

  if(page === "homework")
    homework();

  if(page === "students")
    students();

  if(page === "results")
    results();

  if(page === "fees")
    fees();

  if(page === "notices")
    notices();

  if(page === "profile")
    profile();

}


/* ============================================
   SET CONTENT
   ============================================ */

function setContent(html){

  $("content").innerHTML =
  html;

}


/* ============================================
   DASHBOARD
   ============================================ */

function dashboard(){

  setContent(`

    <div class="title">

      <div>

        <h2>
          Welcome,
          ${userData?.name || "User"} 👋
        </h2>

        <span class="muted">
          Hela Full Board
        </span>

      </div>

    </div>


    <div class="cards">

      <div class="card">

        <small>Account</small>

        <h2>
          ${userData?.role || "Student"}
        </h2>

      </div>


      <div class="card">

        <small>Attendance</small>

        <h2>Live</h2>

      </div>


      <div class="card">

        <small>Homework</small>

        <h2>Live</h2>

      </div>


      <div class="card">

        <small>Database</small>

        <h2>Online</h2>

      </div>

    </div>


    <div class="grid">

      <div class="card">

        <h3>
          School System
        </h3>

        <p>
          Authentication connected.
        </p>

        <p>
          Firestore connected.
        </p>

      </div>


      <div class="card">

        <h3>
          Account
        </h3>

        <p>
          ${currentUser.email}
        </p>

      </div>

    </div>

  `);

}


/* ============================================
   ATTENDANCE
   ============================================ */

async function attendance(){

  setContent(`

    <div class="title">

      <h2>
        Attendance
      </h2>

    </div>


    <div class="card">

      <table id="attendanceTable">

        <tr>
          <th>Date</th>
          <th>Student</th>
          <th>Status</th>
        </tr>

      </table>

    </div>

  `);


  let q;


  if(userData.role === "admin"){

    q =
    collection(
      db,
      "attendance"
    );

  }

  else{

    q =
    query(
      collection(
        db,
        "attendance"
      ),
      where(
        "studentId",
        "==",
        currentUser.uid
      )
    );

  }


  const snapshot =
  await getDocs(q);


  snapshot.forEach(document => {

    const data =
    document.data();


    $("attendanceTable")
    .insertAdjacentHTML(
      "beforeend",

      `

      <tr>

        <td>
          ${data.date || ""}
        </td>

        <td>
          ${data.studentName || ""}
        </td>

        <td>

          <span class="badge ${
            data.status === "Present"
            ? "green"
            : "red"
          }">

            ${data.status || ""}

          </span>

        </td>

      </tr>

      `

    );

  });

}


/* ============================================
   HOMEWORK
   ============================================ */

async function homework(){

  setContent(`

    <div class="title">

      <h2>
        Homework
      </h2>

      ${
        userData.role === "admin"

        ?

        `<button
          id="addHomework"
          class="btn">
          + Add Homework
        </button>`

        :

        ""
      }

    </div>


    <div class="card">

      <table id="homeworkTable">

        <tr>

          <th>Subject</th>
          <th>Title</th>
          <th>Due Date</th>
          <th>Status</th>

        </tr>

      </table>

    </div>

  `);


  const snapshot =
  await getDocs(
    collection(
      db,
      "homework"
    )
  );


  snapshot.forEach(document => {

    const data =
    document.data();


    $("homeworkTable")
    .insertAdjacentHTML(
      "beforeend",

      `

      <tr>

        <td>
          ${data.subject || ""}
        </td>

        <td>
          ${data.title || ""}
        </td>

        <td>
          ${data.due || ""}
        </td>

        <td>
          ${data.status || "Pending"}
        </td>

      </tr>

      `

    );

  });


  if($("addHomework")){

    $("addHomework").onclick =
    addHomework;

  }

}


/* ============================================
   ADD HOMEWORK
   ============================================ */

async function addHomework(){

  const subject =
  prompt("Subject");

  const title =
  prompt("Homework Title");

  const due =
  prompt("Due Date");


  if(!subject || !title)
    return;


  await addDoc(

    collection(
      db,
      "homework"
    ),

    {

      subject,

      title,

      due:due || "",

      status:
      "Pending",

      createdBy:
      currentUser.uid,

      createdAt:
      serverTimestamp()

    }

  );


  alert(
    "Homework successfully saved."
  );


  homework();

}


/* ============================================
   STUDENTS
   ============================================ */

async function students(){

  if(userData.role !== "admin"){

    setContent(`

      <div class="card">

        <h2>
          Access Denied
        </h2>

        <p>
          केवल Admin students देख सकता है।
        </p>

      </div>

    `);

    return;

  }


  setContent(`

    <div class="title">

      <h2>
        Students
      </h2>

    </div>


    <div class="card">

      <table id="studentsTable">

        <tr>

          <th>Name</th>
          <th>Email</th>
          <th>Class</th>
          <th>Role</th>

        </tr>

      </table>

    </div>

  `);


  const snapshot =
  await getDocs(
    collection(
      db,
      "users"
    )
  );


  snapshot.forEach(document => {

    const data =
    document.data();


    $("studentsTable")
    .insertAdjacentHTML(
      "beforeend",

      `

      <tr>

        <td>
          ${data.name || ""}
        </td>

        <td>
          ${data.email || ""}
        </td>

        <td>
          ${data.class || ""}
        </td>

        <td>
          ${data.role || "student"}
        </td>

      </tr>

      `

    );

  });

}


/* ============================================
   RESULTS
   ============================================ */

async function results(){

  setContent(`

    <div class="title">

      <h2>
        Exam Results
      </h2>

    </div>


    <div class="card">

      <table id="resultsTable">

        <tr>

          <th>Student</th>
          <th>Subject</th>
          <th>Marks</th>
          <th>Exam</th>

        </tr>

      </table>

    </div>

  `);


  let q;


  if(userData.role === "admin"){

    q =
    collection(
      db,
      "results"
    );

  }

  else{

    q =
    query(
      collection(
        db,
        "results"
      ),

      where(
        "studentId",
        "==",
        currentUser.uid
      )
    );

  }


  const snapshot =
  await getDocs(q);


  snapshot.forEach(document => {

    const data =
    document.data();


    $("resultsTable")
    .insertAdjacentHTML(
      "beforeend",

      `

      <tr>

        <td>
          ${data.studentName || ""}
        </td>

        <td>
          ${data.subject || ""}
        </td>

        <td>
          ${data.marks || 0}
        </td>

        <td>
          ${data.exam || ""}
        </td>

      </tr>

      `

    );

  });

}


/* ============================================
   FEES
   ============================================ */

async function fees(){

  setContent(`

    <div class="title">

      <h2>
        Fees
      </h2>

    </div>


    <div class="card">

      <table id="feesTable">

        <tr>

          <th>Student</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Date</th>

        </tr>

      </table>

    </div>

  `);


  let q;


  if(userData.role === "admin"){

    q =
    collection(
      db,
      "fees"
    );

  }

  else{

    q =
    query(
      collection(
        db,
        "fees"
      ),

      where(
        "studentId",
        "==",
        currentUser.uid
      )
    );

  }


  const snapshot =
  await getDocs(q);


  snapshot.forEach(document => {

    const data =
    document.data();


    $("feesTable")
    .insertAdjacentHTML(
      "beforeend",

      `

      <tr>

        <td>
          ${data.studentName || ""}
        </td>

        <td>
          ₹${data.amount || 0}
        </td>

        <td>
          ${data.status || "Pending"}
        </td>

        <td>
          ${data.date || ""}
        </td>

      </tr>

      `

    );

  });

}


/* ============================================
   NOTICES
   ============================================ */

async function notices(){

  setContent(`

    <div class="title">

      <h2>
        School Notices
      </h2>

      ${
        userData.role === "admin"

        ?

        `<button
          id="addNotice"
          class="btn">
          + Add Notice
        </button>`

        :

        ""
      }

    </div>


    <div id="noticeList"></div>

  `);


  const snapshot =
  await getDocs(
    collection(
      db,
      "notices"
    )
  );


  snapshot.forEach(document => {

    const data =
    document.data();


    $("noticeList")
    .insertAdjacentHTML(
      "beforeend",

      `

      <div class="card">

        <h3>
          ${data.title || ""}
        </h3>

        <p>
          ${data.message || ""}
        </p>

        <small>
          ${data.date || ""}
        </small>

      </div>

      `

    );

  });


  if($("addNotice")){

    $("addNotice").onclick =
    addNotice;

  }

}


/* ============================================
   ADD NOTICE
   ============================================ */

async function addNotice(){

  const title =
  prompt("Notice Title");

  const message =
  prompt("Notice Message");


  if(!title || !message)
    return;


  await addDoc(

    collection(
      db,
      "notices"
    ),

    {

      title,

      message,

      date:
      new Date()
      .toLocaleDateString(
        "en-IN"
      ),

      createdBy:
      currentUser.uid,

      createdAt:
      serverTimestamp()

    }

  );


  alert(
    "Notice successfully published."
  );


  notices();

}


/* ============================================
   PROFILE
   ============================================ */

function profile(){

  setContent(`

    <div class="title">

      <h2>
        My Profile
      </h2>

    </div>


    <div class="card">

      <h2>
        ${userData?.name || ""}
      </h2>

      <p>
        Email:
        ${currentUser.email}
      </p>

      <p>
        Role:
        ${userData?.role || "student"}
      </p>

      <p>
        Class:
        ${userData?.class || ""}
      </p>

      <p>
        Student ID:
        ${userData?.studentId || currentUser.uid}
      </p>

    </div>

  `);

}

</script>

</body>
</html>

========================================================= */

const $ = id =>
  document.getElementById(id);


function escapeHTML(value){

  if(value === undefined ||
     value === null){

    return "";
  }

  return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


function formatDate(value){

  if(!value){
    return "";
  }

  try{

    if(value.toDate){

      return value
      .toDate()
      .toLocaleDateString("en-IN");

    }

    return value;

  }catch{

    return "";

  }

}


/* =========================================================
   LOGIN
========================================================= */

window.loginUser = async function(){

  const email =
    $("loginEmail").value.trim();

  const password =
    $("loginPassword").value;

  $("loginError").textContent =
    "Login हो रहा है...";

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    $("loginError").textContent =
      error.message;

  }

};


/* =========================================================
   LOGOUT
========================================================= */

window.logoutUser = async function(){

  await signOut(auth);

};


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      $("loginPage")
      .classList
      .remove("hidden");

      $("app")
      .classList
      .add("hidden");

      return;

    }


    currentUser = user;


    try{

      const profileDoc =
        await getDoc(
          doc(
            db,
            "users",
            user.uid
          )
        );


      if(profileDoc.exists()){

        userProfile =
          profileDoc.data();

      }else{

        userProfile = {

          name:
            user.email,

          email:
            user.email,

          class:
            "",

          section:
            ""

        };

      }


      /*
       ADMIN SECURITY

       Firebase Firestore में:

       admins
          UID
             active: true
      */

      const adminDoc =
        await getDoc(
          doc(
            db,
            "admins",
            user.uid
          )
        );


      adminUser =
        adminDoc.exists() &&
        adminDoc.data().active !== false;


      $("loginPage")
      .classList
      .add("hidden");

      $("app")
      .classList
      .remove("hidden");


      currentPage = "home";

      render();

    }catch(error){

      alert(
        "Firebase Error: " +
        error.message
      );

    }

  }
);

/* =========================================================
   TARGET QUERY
========================================================= */

async function getTargetedDocuments(
  collectionName
){

  const records = [];


  /*
   ALL
  */

  try{

    const q =
      query(
        collection(
          db,
          collectionName
        ),
        where(
          "targetType",
          "==",
          "all"
        )
      );

    const snap =
      await getDocs(q);

    snap.forEach(item=>{

      records.push({

        id:item.id,

        ...item.data()

      });

    });

  }catch(error){

    console.log(error);

  }


  /*
   CLASS
  */

  try{

    const q =
      query(
        collection(
          db,
          collectionName
        ),
        where(
          "targetType",
          "==",
          "class"
        )
      );

    const snap =
      await getDocs(q);

    snap.forEach(item=>{

      const data =
        item.data();

      const sameClass =
        data.targetClass ===
        userProfile.class;


      const sameSection =
        data.targetSection ===
        "all" ||
        data.targetSection ===
        userProfile.section;


      if(
        sameClass &&
        sameSection
      ){

        records.push({

          id:item.id,

          ...data

        });

      }

    });

  }catch(error){

    console.log(error);

  }


  /*
   SPECIFIC STUDENT
  */

  try{

    const q =
      query(
        collection(
          db,
          collectionName
        ),
        where(
          "targetType",
          "==",
          "student"
        )
      );

    const snap =
      await getDocs(q);

    snap.forEach(item=>{

      const data =
        item.data();

      if(
        data.targetStudentId ===
        currentUser.uid
      ){

        records.push({

          id:item.id,

          ...data

        });

      }

    });

  }catch(error){

    console.log(error);

  }


  records.sort(

    (a,b)=>
      (b.createdAt?.seconds || 0) -
      (a.createdAt?.seconds || 0)

  );


  return records;

}

function targetHTML(prefix){

  return `

    <label>
      किसे भेजना है?
    </label>

    <select
      id="${prefix}TargetType"
      onchange="targetChanged('${prefix}')"
    >

      <option value="all">
        सभी Students
      </option>

      <option value="class">
        पूरी Class
      </option>

      <option value="student">
        Specific Student
      </option>

    </select>


    <div
      id="${prefix}TargetExtra"
    ></div>

  `;

}


/* =========================================================
   TARGET CHANGED
========================================================= */

window.targetChanged = async function(prefix){

  const type =
    $(
      prefix +
      "TargetType"
    ).value;


  const box =
    $(
      prefix +
      "TargetExtra"
    );


  if(type === "all"){

    box.innerHTML = "";

    return;

  }


  if(type === "class"){

    box.innerHTML = `

      <div class="grid">

        <div>

          <label>
            Class
          </label>

          <input
            id="${prefix}Class"
            placeholder="5"
          >

        </div>


        <div>

          <label>
            Section
          </label>

          <input
            id="${prefix}Section"
            placeholder="A"
          >

        </div>

      </div>

    `;

    return;

  }


  if(type === "student"){

    box.innerHTML =
      "Students loading...";


    try{

      const snap =
        await getDocs(
          collection(
            db,
            "users"
          )
        );


      let options = "";


      snap.forEach(item=>{

        const student =
          item.data();


        options += `

          <option
            value="${item.id}"
          >

            ${escapeHTML(
              student.name ||
              student.email ||
              item.id
            )}

            —

            ${escapeHTML(
              student.class ||
              "-"
            )}

            -

            ${escapeHTML(
              student.section ||
              "-"
            )}

          </option>

        `;

      });


      box.innerHTML = `

        <label>
          Student
        </label>

        <select
          id="${prefix}Student"
        >

          ${options}

        </select>

      `;

    }catch(error){

      box.innerHTML =
        error.message;

    }

  }

};

window.sendHomework = async function(){

  try{

    const type =
      $("hwTargetType").value;


    const data = {

      targetType:
        type,

      subject:
        $("hwSubject").value.trim(),

      title:
        $("hwTitle").value.trim(),

      description:
        $("hwDescription").value.trim(),

      dueDate:
        $("hwDueDate").value,

      createdBy:
        currentUser.uid,

      createdAt:
        serverTimestamp()

    };


    if(
      !data.title
    ){

      alert(
        "Homework Title डालें"
      );

      return;

    }


    if(type === "class"){

      data.targetClass =
        $("hwClass")
        .value
        .trim();

      data.targetSection =
        $("hwSection")
        .value
        .trim() ||
        "all";


      if(!data.targetClass){

        alert(
          "Class डालें"
        );

        return;

      }

    }


    if(type === "student"){

      data.targetStudentId =
        $("hwStudent").value;

    }


    await addDoc(
      collection(
        db,
        "homework"
      ),
      data
    );


    alert(
      "✅ Homework successfully भेज दिया गया!"
    );


    currentPage =
      "homework";

    await render();


  }catch(error){

    alert(
      "Error: " +
      error.message
    );

  }

};

/* =========================================================

========================================================= */

window.deleteRecord =
async function(
  collectionName,
  documentId
){

  const yes =
    confirm(
      "क्या आप इसे delete करना चाहते हैं?"
    );


  if(!yes){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        collectionName,
        documentId
      )
    );


    alert(
      "Deleted successfully"
    );


    await render();


  }catch(error){

    alert(
      error.message
    );

  }

};
